apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: adguard-home
  namespace: adguard-home
  labels:
    app.kubernetes.io/name: adguard-home
    app.kubernetes.io/component: dns-filter
spec:
  serviceName: adguard-home-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: adguard-home
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adguard-home
        app.kubernetes.io/component: dns-filter
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adguard-home
          image: adguard/adguardhome:v0.107.79@sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0
          imagePullPolicy: IfNotPresent
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: web
              containerPort: 3000
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: web
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: web
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: web
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          volumeMounts:
            - name: config
              mountPath: /opt/adguardhome/conf
            - name: work
              mountPath: /opt/adguardhome/work
            - name: tmp
              mountPath: /tmp
      initContainers:
        - name: initialize-config
          image: adguard/adguardhome:v0.107.79@sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |-
              config_file=/opt/adguardhome/conf/AdGuardHome.yaml
              if test -s "$config_file"; then
                exit 0
              fi

              hash_file=/run/secrets/admin/passwordHash
              if ! test -s "$hash_file"; then
                echo "adguard-home-admin Secret is required for first boot" >&2
                exit 1
              fi

              umask 077
              password_hash=$(cat "$hash_file")
              awk -v password_hash="$password_hash" \
                '{gsub(/__ADGUARD_HOME_PASSWORD_HASH__/, password_hash); print}' \
                /bootstrap/AdGuardHome.yaml > "$config_file"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /opt/adguardhome/conf
            - name: bootstrap-config
              mountPath: /bootstrap
              readOnly: true
            - name: admin-secret
              mountPath: /run/secrets/admin
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: bootstrap-config
          configMap:
            name: adguard-home-bootstrap
        - name: admin-secret
          secret:
            secretName: adguard-home-admin
            optional: true
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: config
        labels:
          app.kubernetes.io/name: adguard-home
          app.kubernetes.io/component: configuration
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        volumeMode: Filesystem
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: work
        labels:
          app.kubernetes.io/name: adguard-home
          app.kubernetes.io/component: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        volumeMode: Filesystem
        resources:
          requests:
            storage: 5Gi

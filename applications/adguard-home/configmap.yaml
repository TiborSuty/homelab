apiVersion: v1
kind: ConfigMap
metadata:
  name: adguard-home-bootstrap
  namespace: adguard-home
  labels:
    app.kubernetes.io/name: adguard-home
    app.kubernetes.io/component: configuration
data:
  AdGuardHome.yaml: |-
    http:
      address: 0.0.0.0:3000
      session_ttl: 30d
    users:
      - name: admin
        password: __ADGUARD_HOME_PASSWORD_HASH__
    auth_attempts: 5
    block_auth_min: 15
    language: en
    theme: auto
    dns:
      bind_hosts:
        - 0.0.0.0
      port: 53
      upstream_dns:
        - https://1.1.1.1/dns-query
        - https://dns.quad9.net/dns-query
      bootstrap_dns:
        - 1.1.1.1
        - 9.9.9.9
      upstream_mode: load_balance
      enable_dnssec: true
      cache_enabled: true
      cache_size: 4194304
      refuse_any: true
      serve_plain_dns: true
    querylog:
      interval: 30d
      size_memory: 1000
      enabled: true
      file_enabled: true
    statistics:
      interval: 30d
      enabled: true
    filters:
      - enabled: true
        url: https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/pro.txt
        name: HaGeZi Pro
        id: 1
    whitelist_filters: []
    user_rules: []
    dhcp:
      enabled: false
    filtering:
      blocking_mode: default
      filters_update_interval: 24
      blocked_response_ttl: 10
      filtering_enabled: true
      rewrites_enabled: true
      parental_enabled: false
      safebrowsing_enabled: false
      protection_enabled: true
    clients:
      runtime_sources:
        whois: false
        arp: false
        rdns: false
        dhcp: false
        hosts: true
      persistent: []
    log:
      enabled: true
      max_backups: 0
      max_size: 100
      max_age: 3
      compress: false
      local_time: true
      verbose: false
    schema_version: 34

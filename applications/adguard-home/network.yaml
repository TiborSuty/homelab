apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan-dns
spec:
  blocks:
    - start: 192.168.187.210
      stop: 192.168.187.210
  serviceSelector:
    matchLabels:
      homelab.tiborsuty.io/load-balancer-pool: lan-dns
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lan-dns
spec:
  serviceSelector:
    matchLabels:
      homelab.tiborsuty.io/load-balancer-pool: lan-dns
  interfaces:
    - ^eno[0-9]+$
  externalIPs: false
  loadBalancerIPs: true

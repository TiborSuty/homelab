apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: loky-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Dedicated PostgreSQL and PostGIS database for Loky Planner
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgis:16-3.4@sha256:bb5a8590a8c934767482e34e1d103253f412aec703b77bbc52ad9044bf6e56f9
  bootstrap:
    initdb:
      database: loky
      owner: loky
      secret:
        name: loky-postgres-credentials
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS postgis;
        - CREATE EXTENSION IF NOT EXISTS pgcrypto;
  storage:
    storageClass: longhorn
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  monitoring:
    enablePodMonitor: false

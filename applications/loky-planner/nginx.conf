worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # Signed S3 URLs contain credentials in their query string.
  log_format loky '$remote_addr "$request_method $uri $server_protocol" $status $body_bytes_sent';
  access_log /dev/stdout loky;
  sendfile on;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  client_max_body_size 110m;

  upstream loky_api { server loky-api:6001; }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz { access_log off; return 200 'ok\n'; }
    location = /readyz { proxy_pass http://loky_api; }
    location = /graphql { proxy_pass http://loky_api; }
    location ^~ /uploads/ { proxy_pass http://loky_api; }
    location ^~ /admin/queues { proxy_pass http://loky_api; }
    location ~ ^/share/media/[^/]+/(original|thumbnail|preview)$ {
      proxy_pass http://loky_api;
    }

    # Keep the bucket path and original hostname: both are signed by S3.
    # Browser uploads use this same HTTPS origin and its NetBird SSO session.
    location ^~ /loky-media/ {
      proxy_pass http://minio.minio.svc.cluster.local:9000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Connection "";
      proxy_set_header Authorization "";
      proxy_set_header Cookie "";
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|webp|svg|ico)$ {
      try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}

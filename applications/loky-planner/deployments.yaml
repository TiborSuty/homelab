apiVersion: apps/v1
kind: Deployment
metadata:
  name: loky-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loky-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loky-api
        app.kubernetes.io/part-of: loky-planner
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: registry-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: registry.homelab.internal/loky/server:20260915-browser@sha256:fdf348935acfd8960b69f618291905be0bd62e317c7b81f2aadea2c0e2bb4df0
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/server/api.js"]
          envFrom:
            - configMapRef:
                name: loky-config
            - secretRef:
                name: loky-runtime
          ports:
            - name: http
              containerPort: 6001
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---

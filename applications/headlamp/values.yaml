fullnameOverride: headlamp

replicaCount: 1

image:
  pullPolicy: IfNotPresent
  tag: "v0.45.0@sha256:db3f0e0fc58d358d41daa3fe7fc852437552c7ee873c3645470f7b86a8e0db49"

config:
  inCluster: true
  inClusterContextName: homelab
  # NetBird authenticates users at the only published edge. Every admitted
  # user receives this deliberately read-only ServiceAccount identity.
  unsafeUseServiceAccountToken: true
  enableHelm: false
  staticPlugins:
    enabled: true
  oidc:
    secret:
      create: false

automountServiceAccountToken: true

serviceAccount:
  create: true
  name: headlamp

# The upstream chart defaults to a binding named headlamp-admin with
# cluster-admin privileges. rbac.yaml creates an explicitly named read-only
# binding instead.
clusterRoleBinding:
  create: false

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false

podSecurityContext:
  runAsNonRoot: true
  fsGroup: 101
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  livenessProbe:
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readinessProbe:
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

machine:
    install:
        image: factory.talos.dev/metal-installer/613e1592b2da41ae5e265e8789429f22e121aab91cb4deb6bc3c0b6262961245:v1.13.8
        disk:
            $patch: delete
        diskSelector:
            model: "Vi550 S3 SSD"
    kubelet:
        extraMounts:
            - destination: /var/lib/longhorn
              type: bind
              source: /var/lib/longhorn
              options:
                  - bind
                  - rshared
                  - rw
---
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
    - address: 192.168.187.1
    - address: 1.1.1.1
---
apiVersion: v1alpha1
kind: TimeSyncConfig
ntp:
    servers:
        - time.cloudflare.com
        - pool.ntp.org

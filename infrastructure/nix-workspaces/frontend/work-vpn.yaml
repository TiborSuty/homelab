apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev
spec:
  template:
    spec:
      initContainers:
      - name: work-vpn-resolver
        image: docker.io/netbirdio/netbird:0.82.0@sha256:eca5b274c635bfbb04ec6724a0712d1146190dd450eea199eeb83916fdd94965
        command:
        - /bin/sh
        - -ec
        args:
        - "# A non-loopback DNS address also works in nested Docker containers.\n\
          printf 'nameserver %s\\n' \"$POD_IP\" > /resolver/resolv.conf\nsed '/^[[:space:]]*nameserver[[:space:]]/d'\
          \ /etc/resolv.conf >> /resolver/resolv.conf\nchmod 0644 /resolver/resolv.conf\n\
          # CoreDNS can start before VPN enrollment; initially use cluster DNS.\n\
          /bin/sh /vpn-config/sync-dns.sh --once\n# Only seed public settings; NetBird\
          \ generates this peer's keys.\n# Preserve the enrolled identity on every\
          \ subsequent restart.\nchmod 0700 /var/lib/netbird\nif [ ! -e /var/lib/netbird/default.json\
          \ ]; then\n  umask 077\n  cp /vpn-config/default.json /var/lib/netbird/default.json\n\
          fi\n# One-time migration from our earlier overrides to EAG's defaults.\n\
          # Change only these settings; preserve all enrollment keys/state.\nif [\
          \ ! -e /var/lib/netbird/.eag-defaults-v1 ]; then\n  sed -i \\\n    -e 's/\"\
          CustomDNSAddress\": \"127.0.0.1:5353\"/\"CustomDNSAddress\": \"\"/' \\\n\
          \    -e 's/\"DisableDNS\": true/\"DisableDNS\": false/' \\\n    -e 's/\"\
          DisableServerRoutes\": true/\"DisableServerRoutes\": false/' \\\n    -e\
          \ 's/\"BlockInbound\": true/\"BlockInbound\": false/' \\\n    -e 's/\"DisableIPv6\"\
          : true/\"DisableIPv6\": false/' \\\n    /var/lib/netbird/default.json\n\
          \  umask 077\n  touch /var/lib/netbird/.eag-defaults-v1\nfi\n"
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: work-vpn-resolver
          mountPath: /resolver
        - name: work-vpn-data
          mountPath: /var/lib/netbird
        - name: frontend-vpn-config
          mountPath: /vpn-config
          readOnly: true
      containers:
      - name: workspace
        volumeMounts:
        - name: work-vpn-resolver
          mountPath: /etc/resolv.conf
          subPath: resolv.conf
          readOnly: true
      - name: application
        volumeMounts:
        - name: work-vpn-resolver
          mountPath: /etc/resolv.conf
          subPath: resolv.conf
          readOnly: true
      - name: work-vpn
        image: docker.io/netbirdio/netbird:0.82.0@sha256:eca5b274c635bfbb04ec6724a0712d1146190dd450eea199eeb83916fdd94965
        command:
        - /bin/sh
        - -ec
        args:
        - '/bin/sh /vpn-config/sync-dns.sh &

          dns_pid=$!

          /usr/local/bin/netbird service run &

          vpn_pid=$!

          trap ''kill "$vpn_pid" "$dns_pid" 2>/dev/null || true; wait || true'' EXIT

          trap ''exit 0'' TERM INT

          # Restart the container if either the VPN or resolver watcher fails.

          while kill -0 "$vpn_pid" && kill -0 "$dns_pid"; do sleep 2; done

          exit 1

          '
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NB_MANAGEMENT_URL
          value: https://vpn.eag-group.cloud:33073
        - name: NB_HOSTNAME
          value: nix-frontend-eag
        - name: NB_LOG_FILE
          value: console,/var/log/netbird/client.log
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - NET_ADMIN
            - NET_RAW
            - NET_BIND_SERVICE
            - SYS_RESOURCE
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 256Mi
        readinessProbe:
          exec:
            command:
            - /usr/local/bin/netbird
            - status
            - --check
            - live
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - name: work-vpn-data
          mountPath: /var/lib/netbird
        - name: work-vpn-resolver
          mountPath: /resolver
        - name: frontend-vpn-config
          mountPath: /vpn-config
          readOnly: true
      - name: work-vpn-dns
        image: registry.k8s.io/coredns/coredns:v1.14.6@sha256:900f9c109f7a33545d3c811516e8376df9019147b750f5ce3e254468769176ea
        args:
        - -conf
        - /etc/coredns/Corefile
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        securityContext:
          runAsUser: 65532
          runAsGroup: 65532
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 200m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: 8189
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8089
          periodSeconds: 10
        volumeMounts:
        - name: frontend-vpn-config
          mountPath: /etc/coredns
          readOnly: true
        - name: work-vpn-resolver
          mountPath: /run/work-vpn-dns
          readOnly: true
      volumes:
      - name: work-vpn-resolver
        emptyDir: {}
      - name: work-vpn-data
        persistentVolumeClaim:
          claimName: frontend-vpn-data
      - name: frontend-vpn-config
        configMap:
          name: frontend-vpn-config

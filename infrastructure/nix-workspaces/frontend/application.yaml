apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev
spec:
  template:
    spec:
      containers:
        - name: application
          image: registry.homelab.internal/dev/nix-workspace@sha256:43bae2587b0980e72fd87d82c1c8c265abce8652c8d6086a73eac0f4298de98b
          command: [/bin/sh, /run/workspace-startup/start-dms.sh]
          env:
            - name: HOME
              value: /workspace/home
            - name: PATH
              value: /opt/frontend-tools/bin:/opt/tools/bin:/nix/var/nix/profiles/default/bin:/usr/bin:/bin
            - name: NIX_REMOTE
              value: local
            - name: NIX_SSL_CERT_FILE
              value: /etc/ssl/certs/ca-bundle.crt
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 16Gi
          readinessProbe:
            httpGet:
              path: /
              port: 4300
              httpHeaders:
                - name: Host
                  value: app.frontend-dev.nix-workspaces.homelab.internal
            timeoutSeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: home
              mountPath: /workspace
            - name: startup
              mountPath: /run/workspace-startup
              readOnly: true
            - name: frontend-environment
              mountPath: /run/project-environment
              readOnly: true
      volumes:
        - name: startup
          configMap:
            name: frontend-startup
        - name: frontend-environment
          secret:
            secretName: frontend-dms-environment
            defaultMode: 0444

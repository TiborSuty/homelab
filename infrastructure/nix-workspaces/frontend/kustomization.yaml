apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
images:
- name: registry.homelab.internal/dev/nix-workspace
  digest: sha256:fd18be8bbbd7cc0bf1eac2933177d2220348e76cf9340bd1ca128cec38cb7e7f
resources:
- ../base
- ../worktrees
- work-vpn-data.yaml
configMapGenerator:
- name: frontend-vpn-config
  files:
  - Corefile=work-vpn.Corefile
  - default.json=work-vpn-default.json
  - sync-dns.sh=sync-work-vpn-dns.sh
- name: frontend-startup
  files:
  - start-dms.sh
patches:
- patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: dev
    spec:
      template:
        spec:
          containers:
          - name: workspace
            command:
            - /bin/sh
            - -ec
            - |
              printf '\nMatch User dev\n  AllowTcpForwarding yes\n  PermitListen 127.0.0.1:19988\n' >> /etc/ssh/sshd_config
              exec /usr/local/bin/workspace-entrypoint
          volumes:
          - name: home
            persistentVolumeClaim:
              claimName: frontend-home
- target:
    kind: Deployment
    name: dev
  patch: |
    - op: replace
      path: /spec/selector/matchLabels/app.kubernetes.io~1instance
      value: frontend
    - op: replace
      path: /spec/template/metadata/labels/app.kubernetes.io~1instance
      value: frontend
    - op: add
      path: /spec/template/spec/containers/0/env
      value:
      - name: WORKSPACE_PROFILE
        value: frontend
    - op: replace
      path: /spec/template/spec/containers/0/ports/1/containerPort
      value: 4300
    - op: replace
      path: /spec/selector/matchLabels/app.kubernetes.io~1name
      value: frontend
    - op: replace
      path: /spec/template/metadata/labels/app.kubernetes.io~1name
      value: frontend
- target:
    kind: Service
    name: dev
  patch: |
    - op: replace
      path: /spec/selector/app.kubernetes.io~1instance
      value: frontend
    - op: add
      path: /spec/publishNotReadyAddresses
      value: true
    - op: replace
      path: /spec/selector/app.kubernetes.io~1name
      value: frontend
- target:
    kind: NetworkResource
    name: dev
  patch: |
    - op: replace
      path: /spec/serviceRef/name
      value: frontend
- path: application.yaml
- path: work-vpn.yaml
- path: worktree-runner.yaml
- target:
    kind: Deployment
    name: dev
  patch: |
    - op: replace
      path: /metadata/name
      value: frontend
- target:
    kind: Service
    name: dev
  patch: |
    - op: replace
      path: /metadata/name
      value: frontend
- target:
    kind: NetworkResource
    name: dev
  patch: |
    - op: replace
      path: /metadata/name
      value: frontend
- target:
    kind: PersistentVolumeClaim
    name: dev-home
  patch: |
    - op: replace
      path: /metadata/name
      value: frontend-home
- target:
    kind: ConfigMap
    name: worktree-tools
  patch: |
    - op: replace
      path: /metadata/name
      value: frontend-worktree-tools

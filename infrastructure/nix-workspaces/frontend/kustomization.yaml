apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: frontend-
resources:
  - ../base
  - docker-data.yaml
configMapGenerator:
  - name: frontend-startup
    files:
      - start-dms.sh
patches:
  - target:
      kind: Deployment
      name: dev
    patch: |-
      - op: replace
        path: /spec/selector/matchLabels/app.kubernetes.io~1instance
        value: frontend
      - op: replace
        path: /spec/template/metadata/labels/app.kubernetes.io~1instance
        value: frontend
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: WORKSPACE_PROFILE
            value: frontend
      - op: replace
        path: /spec/template/spec/containers/0/ports/1/containerPort
        value: 4300
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 32Gi
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: registry.homelab.internal/dev/nix-workspace@sha256:74bcc1d9fe3394e2ff337801bc85ba99c413a61b0cc97214a04b73bf5ad80842
  - target:
      kind: Service
      name: dev
    patch: |-
      - op: replace
        path: /spec/selector/app.kubernetes.io~1instance
        value: frontend
  - target:
      kind: NetworkResource
      name: dev
    patch: |-
      - op: replace
        path: /spec/serviceRef/name
        value: frontend-dev
  - path: application.yaml
  - path: docker-engine.yaml

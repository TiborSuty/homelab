apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: frontend-
resources:
  - ../base
  - docker-data.yaml
  - work-vpn-data.yaml
configMapGenerator:
  - name: work-vpn-config
    files:
      - Corefile=work-vpn.Corefile
      - default.json=work-vpn-default.json
  - name: frontend-startup
    files:
      - start-dms.sh
patches:
  - target:
      kind: Deployment
      name: dev
    patch: |-
      - op: replace
        path: /spec/selector/matchLabels/app.kubernetes.io~1instance
        value: frontend
      - op: replace
        path: /spec/template/metadata/labels/app.kubernetes.io~1instance
        value: frontend
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: WORKSPACE_PROFILE
            value: frontend
      - op: replace
        path: /spec/template/spec/containers/0/ports/1/containerPort
        value: 4300
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 32Gi
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: registry.homelab.internal/dev/nix-workspace@sha256:8fe9e1de7f526ec775f087d914754d9225ab548112a80a34bb73375e59140109
  - target:
      kind: Service
      name: dev
    patch: |-
      - op: replace
        path: /spec/selector/app.kubernetes.io~1instance
        value: frontend
  - target:
      kind: NetworkResource
      name: dev
    patch: |-
      - op: replace
        path: /spec/serviceRef/name
        value: frontend-dev
  - path: application.yaml
  - path: docker-engine.yaml
  - path: work-vpn.yaml

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: frontend-
resources:
  - ../base
  - docker-data.yaml
configMapGenerator:
  - name: frontend-startup
    files:
      - start-dms.sh
patches:
  - target:
      kind: Deployment
      name: dev
    patch: |-
      - op: replace
        path: /spec/selector/matchLabels/app.kubernetes.io~1instance
        value: frontend
      - op: replace
        path: /spec/template/metadata/labels/app.kubernetes.io~1instance
        value: frontend
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: WORKSPACE_PROFILE
            value: frontend
      - op: replace
        path: /spec/template/spec/containers/0/ports/1/containerPort
        value: 4300
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 32Gi
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: registry.homelab.internal/dev/nix-workspace@sha256:8c6f975e4b9da4615d1aeed81bf5b1b1737252a7a8e518a92a54ed960c2bd51e
  - target:
      kind: Service
      name: dev
    patch: |-
      - op: replace
        path: /spec/selector/app.kubernetes.io~1instance
        value: frontend
  - target:
      kind: NetworkResource
      name: dev
    patch: |-
      - op: replace
        path: /spec/serviceRef/name
        value: frontend-dev
  - path: application.yaml
  - path: docker-engine.yaml

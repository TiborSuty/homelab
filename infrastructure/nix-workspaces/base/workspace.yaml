apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dev-home
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-nix-workspaces
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nix-workspace
      app.kubernetes.io/instance: dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nix-workspace
        app.kubernetes.io/instance: dev
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: workspace-registry-pull
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: workspace
          # Verified AMD64 manifest in the private registry.
          image: registry.homelab.internal/dev/nix-workspace@sha256:f4594df163f2e13ba98c4ce396d7cae8785f22359930a02be2562e91480b7992
          imagePullPolicy: IfNotPresent
          ports:
            - name: ssh
              containerPort: 2222
            - name: app
              containerPort: 3000
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, SYS_CHROOT]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 8Gi
          readinessProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: ssh
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: home
              mountPath: /workspace
            - name: ssh-keys
              mountPath: /run/keys
              readOnly: true
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: dev-home
        - name: ssh-keys
          secret:
            secretName: dev-authorized-keys
            defaultMode: 0444
---
apiVersion: v1
kind: Service
metadata:
  name: dev
spec:
  selector:
    app.kubernetes.io/name: nix-workspace
    app.kubernetes.io/instance: dev
  ports:
    - name: ssh
      port: 2222
      targetPort: ssh
    - name: app
      port: 80
      targetPort: app

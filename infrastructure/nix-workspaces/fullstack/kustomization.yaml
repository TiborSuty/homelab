apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../base
- docker-data.yaml
- work-vpn-data.yaml
- ../worktrees
configMapGenerator:
- name: fullstack-vpn-config
  files:
  - Corefile=work-vpn.Corefile
  - default.json=work-vpn-default.json
  - sync-dns.sh=sync-work-vpn-dns.sh
- name: fullstack-startup
  files:
  - start-dms.sh
  - start-forwarded-frontend.sh
patches:
- patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: dev
    spec:
      template:
        spec:
          volumes:
          - name: home
            persistentVolumeClaim:
              claimName: frontend-dev-home
- target:
    kind: Deployment
    name: dev
  patch: |
    - op: replace
      path: /spec/selector/matchLabels/app.kubernetes.io~1instance
      value: fullstack
    - op: replace
      path: /spec/template/metadata/labels/app.kubernetes.io~1instance
      value: fullstack
    - op: add
      path: /spec/template/spec/containers/0/env
      value:
      - name: WORKSPACE_PROFILE
        value: frontend
    - op: replace
      path: /spec/template/spec/containers/0/ports/1/containerPort
      value: 4300
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 32Gi
    - op: replace
      path: /spec/template/spec/containers/0/image
      value: registry.homelab.internal/dev/nix-workspace@sha256:8fe9e1de7f526ec775f087d914754d9225ab548112a80a34bb73375e59140109
- target:
    kind: Service
    name: dev
  patch: |
    - op: replace
      path: /spec/selector/app.kubernetes.io~1instance
      value: fullstack
- target:
    kind: NetworkResource
    name: dev
  patch: |
    - op: replace
      path: /spec/serviceRef/name
      value: fullstack
- path: application.yaml
- path: forwarded-frontends.yaml
- path: worktree-runner.yaml
- path: dms-build-cache.yaml
- path: docker-engine.yaml
- path: work-vpn.yaml
- target:
    kind: Deployment
    name: dev
  patch: |
    - op: replace
      path: /metadata/name
      value: fullstack
- target:
    kind: Service
    name: dev
  patch: |
    - op: replace
      path: /metadata/name
      value: fullstack
- target:
    kind: NetworkResource
    name: dev
  patch: |
    - op: replace
      path: /metadata/name
      value: fullstack
- target:
    kind: PersistentVolumeClaim
    name: dev-home
  patch: |
    - op: replace
      path: /metadata/name
      value: frontend-dev-home
- target:
    kind: ConfigMap
    name: worktree-tools
  patch: |
    - op: replace
      path: /metadata/name
      value: fullstack-worktree-tools

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: backend-
resources:
  - ../base
patches:
  - target:
      kind: Deployment
      name: dev
    patch: |-
      - op: replace
        path: /spec/selector/matchLabels/app.kubernetes.io~1instance
        value: backend
      - op: replace
        path: /spec/template/metadata/labels/app.kubernetes.io~1instance
        value: backend
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: WORKSPACE_PROFILE
            value: backend
      - op: replace
        path: /spec/template/spec/containers/0/ports/1/containerPort
        value: 8080
  - target:
      kind: Service
      name: dev
    patch: |-
      - op: replace
        path: /spec/selector/app.kubernetes.io~1instance
        value: backend
  - target:
      kind: NetworkResource
      name: dev
    patch: |-
      - op: replace
        path: /spec/serviceRef/name
        value: backend-dev
  - target:
      kind: PersistentVolumeClaim
      name: dev-home
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 30Gi

apiVersion: v1
kind: ServiceAccount
metadata:
  name: clusterproxy-homelab
  namespace: netbird
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: netbird-clusterproxy-homelab
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups:
      - ""
    resources:
      - users
      - groups
    verbs:
      - impersonate
  - apiGroups:
      - authentication.k8s.io
    resources:
      - userextras/*
      - uids
    verbs:
      - impersonate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: netbird-clusterproxy-homelab
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: netbird-clusterproxy-homelab
subjects:
  - kind: ServiceAccount
    name: clusterproxy-homelab
    namespace: netbird
---
# NetBird passes the authenticated user's group names to Kubernetes. Membership
# in this deliberately named group is the explicit cluster-admin security gate.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: netbird-kubernetes-admins
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: Group
    name: kubernetes-admins
    apiGroup: rbac.authorization.k8s.io

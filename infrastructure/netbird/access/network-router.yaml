apiVersion: netbird.io/v1alpha1
kind: NetworkRouter
metadata:
  name: homelab-services
  namespace: netbird
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  dnsZoneRef:
    name: homelab.internal
  # Cilium's kube-proxy replacement bypasses the kernel conntrack path used by
  # rootful routing peers. NetBird's userspace image avoids that dependency.
  image: ghcr.io/netbirdio/netbird:0.72.4-rootless@sha256:d42136aabccb82c5237d2ee73febde237e13e850727bcb6bbf5b3c8717ece142
  workloadOverride:
    # One peer is sufficient initially. Increase to three for node-level HA.
    replicas: 1
    podTemplate:
      spec:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch

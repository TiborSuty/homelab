apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homelab-router-identity
  namespace: netbird
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  storageClassName: longhorn
  accessModes: [ReadWriteOncePod]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: netbird.io/v1alpha1
kind: SetupKey
metadata:
  name: homelab-router-persistent
  namespace: netbird
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  name: homelab-router-persistent
  ephemeral: false
  allowExtraDnsLabels: false
  autoGroups:
    - localRef:
        name: networkrouter-homelab-services
---
# The operator owns the Deployment template. Argo uses server-side apply to
# own only the rollout strategy, after the NetworkRouter creates the Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: networkrouter-homelab-services
  namespace: netbird
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: Validate=false,DisableClientSideApplyMigration=true
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

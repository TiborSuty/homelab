apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan-registry
spec:
  blocks:
    - start: 192.168.187.211
      stop: 192.168.187.211
  serviceSelector:
    matchLabels:
      homelab.tiborsuty.io/load-balancer-pool: lan-registry
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lan-registry
spec:
  serviceSelector:
    matchLabels:
      homelab.tiborsuty.io/load-balancer-pool: lan-registry
  interfaces:
    - ^eno[0-9]+$
  externalIPs: false
  loadBalancerIPs: true

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zot
  namespace: registry
  labels:
    app.kubernetes.io/name: zot
    app.kubernetes.io/component: registry
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zot
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        # Cilium classifies external LoadBalancer traffic as world, including
        # traffic SNATed through a lease holder on another cluster node.
        - ipBlock:
            cidr: 0.0.0.0/0
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: registry
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: arc-loky-planner
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: loky-planner
      ports:
        - port: 5000
          protocol: TCP
  egress: []
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: zot-remote-node
  namespace: registry
  labels:
    app.kubernetes.io/name: zot
    app.kubernetes.io/component: registry
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: zot
  ingress:
    - fromEntities:
        - remote-node
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP

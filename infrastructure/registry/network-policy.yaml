apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zot
  namespace: registry
  labels:
    app.kubernetes.io/name: zot
    app.kubernetes.io/component: registry
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zot
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 192.168.187.0/24
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: registry
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: arc-loky-planner
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: loky-planner
      ports:
        - port: 5000
          protocol: TCP
  egress: []

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zot
  namespace: registry
  labels:
    app.kubernetes.io/name: zot
    app.kubernetes.io/component: registry
spec:
  serviceName: zot-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: zot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zot
        app.kubernetes.io/component: registry
    spec:
      serviceAccountName: zot
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zot
          image: ghcr.io/project-zot/zot:v2.1.21@sha256:6b69512c00dceaad05b1144e6079aac6aa7309d7fd200f9947ecb1de09cf48c8
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - /etc/zot/config.json
          ports:
            - name: registry
              containerPort: 5000
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: registry
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: registry
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: registry
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
            - name: config
              mountPath: /etc/zot
              readOnly: true
            - name: auth
              mountPath: /secret
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: zot-config
        - name: auth
          secret:
            secretName: zot-auth
            defaultMode: 0440
        - name: tls
          secret:
            secretName: registry-tls
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: zot
          app.kubernetes.io/component: registry
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        volumeMode: Filesystem
        resources:
          requests:
            storage: 20Gi

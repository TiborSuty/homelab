apiVersion: apps/v1
kind: Deployment
metadata:
  name: coder-workspace-apps
  namespace: coder-system
  labels:
    app.kubernetes.io/name: coder-workspace-apps
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: coder-workspace-apps
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coder-workspace-apps
        app.kubernetes.io/component: gateway
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:stable-alpine@sha256:442753882674b49ae2c1de83ed67896131c0777f56df5005e356e62bc3f7e7ce
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /_gateway/healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /_gateway/healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /_gateway/healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: coder-workspace-apps
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: coder-workspace-apps
  namespace: coder-system
  labels:
    app.kubernetes.io/name: coder-workspace-apps
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: coder-workspace-apps
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: netbird.io/v1alpha1
kind: NetworkResource
metadata:
  name: coder-workspace-apps
  namespace: coder-system
  labels:
    app.kubernetes.io/name: coder-workspace-apps
    app.kubernetes.io/component: network-access
spec:
  networkRouterRef:
    name: homelab-services
    namespace: netbird
  serviceRef:
    name: coder-workspace-apps
  groups:
    - name: dashboard-services

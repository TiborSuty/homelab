coder:
  envUseClusterAccessURL: false
  env:
    - name: CODER_ACCESS_URL
      value: http://coder.coder-system.homelab.internal
    - name: CODER_PG_CONNECTION_URL
      valueFrom:
        secretKeyRef:
          name: coder-postgres-credentials
          key: uri
    - name: CODER_TELEMETRY_ENABLE
      value: "false"

  serviceAccount:
    workspacePerms: false
    enableDeployments: false
    workspaceNamespaces:
      - name: coder-workspaces
        workspacePerms: true
        enableDeployments: true
        extraRules:
          - apiGroups:
              - ""
            resources:
              - services
            verbs:
              - create
              - delete
              - deletecollection
              - get
              - list
              - patch
              - update
              - watch

  securityContext:
    capabilities:
      drop:
        - ALL

  service:
    type: ClusterIP

  ingress:
    enable: false

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

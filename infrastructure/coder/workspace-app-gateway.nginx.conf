worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr info;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;

  client_body_temp_path /tmp/client-body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  resolver 10.96.0.10 valid=10s ipv6=off;

  server {
    listen 8080 default_server;
    server_name _;

    location = /_gateway/healthz {
      access_log off;
      return 200 "ok\n";
    }

    location / {
      return 404;
    }
  }

  server {
    listen 8080;
    server_name ~^(?<tenant>[a-z0-9-]+)\.(?<workspace>[a-z0-9-]+)\.(?<owner>[a-z0-9-]+)\.apps\.coder\.homelab\.internal$;

    set $workspace_service coder-$owner-$workspace.coder-workspaces.svc.cluster.local;

    location / {
      proxy_pass http://$workspace_service;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}

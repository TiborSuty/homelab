apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: coder-workspace-apps
    namespace: coder-system
    files:
      - nginx.conf=workspace-app-gateway.nginx.conf
    options:
      labels:
        app.kubernetes.io/name: coder-workspace-apps
        app.kubernetes.io/component: gateway

resources:
  - workspace-namespace.yaml
  - workspace-storage-class.yaml
  - vaultwarden-ca.yaml
  - postgres.yaml
  - network-resource.yaml
  - workspace-app-gateway.yaml

deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 168h
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    max_cache_freshness_per_query: 10m
    split_queries_by_interval: 15m
    query_timeout: 300s
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
    working_directory: /var/loki/compactor
  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  persistence:
    enabled: true
    storageClass: longhorn
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    whenDeleted: Retain
    whenScaled: Retain
  podDisruptionBudget:
    enabled: false

# Disable the components used by the simple-scalable deployment mode.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

podDisruptionBudget:
  enabled: false

gateway:
  enabled: true
  replicas: 1
  verboseLogging: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  podDisruptionBudget:
    enabled: false

lokiCanary:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

chunksCache:
  enabled: false
resultsCache:
  enabled: false
minio:
  enabled: false

monitoring:
  dashboards:
    enabled: true
    defaultDashboardsTimezone: Europe/Bratislava
  rules:
    enabled: true
  alerts:
    enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s

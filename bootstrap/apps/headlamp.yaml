apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  project: homelab
  ignoreDifferences:
    # The Kubernetes aggregation controller populates these rules from the
    # selected read-only roles after Argo applies the empty aggregate role.
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: headlamp-cluster-view
      jsonPointers:
        - /rules
  sources:
    - repoURL: https://kubernetes-sigs.github.io/headlamp/
      chart: headlamp
      targetRevision: 0.45.0
      helm:
        releaseName: headlamp
        valueFiles:
          - $values/applications/headlamp/values.yaml
    - repoURL: https://github.com/TiborSuty/homelab.git
      targetRevision: main
      ref: values
      path: applications/headlamp
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
